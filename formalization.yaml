version: v0.4
project:
  name: Near-Linear Preprocessing for Reachability After Two Vertex Failures in Directed
    Acyclic Graphs
  description: Theorem 1.1 gives a deterministic word-RAM oracle for a fixed source
    in a directed acyclic graph. For n vertices and m arc occurrences, construction
    takes O((n+m) log²(n+2)) operations and O(n+m) peak words and retains O(n) words.
    Using the retained index alone, the query program decides reachability to an original
    target after at most two vertex failures in O(log(n+2)) operations.
  authors:
